name: Bug Report
description: Report a reproducible defect in Kalita, its build, or its CI/packaging.
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use this form for reproducible bugs. **Never attach a real `Data.mdb` or other
        personal financial data** — use a generated fixture (dev_plan.md §14.2) or describe
        the schema/data shape instead. For a suspected security issue (data corruption, a
        crafted file crashing the app, credential handling), use
        [private vulnerability reporting](https://github.com/XOlegator/kalita/security/advisories/new)
        instead of this form.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the defect and its impact.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux (desktop)
        - Android
    validations:
      required: true
  - type: input
    id: platform-version
    attributes:
      label: Platform Version
      description: "Windows build, Linux distro/version (e.g. Ubuntu 24.04), or Android API level."
      placeholder: Ubuntu 26.04
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Kalita Version
      description: Release tag, commit, or branch.
      placeholder: v0.1.3 or 1cd74c3
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction Steps
      description: Exact steps, ideally against a fixture database rather than a real one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional Context
      description: Logs, stack traces, CI run links, or related dev_plan.md sections.
