name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Build
        run: ./gradlew build

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6

  package-smoke:
    # Stage 0.3 PoC (dev_plan.md): jpackage-built installers actually run on fresh machines of
    # every target OS (NFR-2) — ubuntu-24.04/ubuntu-26.04 and windows-2025 are GitHub-hosted
    # runners, i.e. a clean VM per job, which is exactly what the PoC needs; no self-hosted
    # infrastructure required. `--self-test` (app-desktop's Main.kt) builds the real window and
    # exercises the storage-mdb round trip, then exits 0 instead of entering the event loop, so
    # this runs headless with no display and no background-process/timeout juggling.
    name: package-smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            task: packageAppImage
            qt-host: linux
            qt-arch: linux_gcc_64
            qt-arch-dir: gcc_64
          - os: ubuntu-26.04
            task: packageAppImage
            qt-host: linux
            qt-arch: linux_gcc_64
            qt-arch-dir: gcc_64
          - os: windows-2025
            task: packageMsi
            qt-host: windows
            qt-arch: win64_msvc2022_64
            qt-arch-dir: msvc2022_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Install appimagetool
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool

      - name: Install Qt's system runtime dependencies (Linux)
        # Bare GitHub Linux runners have no graphics stack at all (no libEGL/libGL — a real desktop
        # always does). qt6-base-dev itself has the wrong Qt (R21 — 24.04's is 6.4.2), but its
        # transitive apt deps are exactly the system-provided libraries (EGL/GL, fontconfig, xcb,
        # ...) real Qt 6.10.2 needs and that the bundled-Qt step below deliberately does NOT bundle,
        # same as every other Linux Qt app distribution — only Qt's own libraries travel with the app.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends qt6-base-dev

      - name: Install aqtinstall
        run: pip install aqtinstall

      - name: Fetch Qt 6.10.2 (bundled into the installer — QtJambi doesn't ship real Qt, docs/adr/0008)
        run: >
          aqt install-qt ${{ matrix.qt-host }} desktop 6.10.2 ${{ matrix.qt-arch }}
          --outputdir ${{ runner.temp }}/qt

      - name: Build installer
        run: >
          ./gradlew :modules:app-desktop:${{ matrix.task }}
          -PbundledQtDir=${{ runner.temp }}/qt/6.10.2/${{ matrix.qt-arch-dir }}

      - name: Smoke test the AppImage (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # --appimage-extract-and-run sidesteps needing libfuse2 on the runner image.
          ./modules/app-desktop/build/appimage/Kalita-x86_64.AppImage --appimage-extract-and-run --self-test

      - name: Smoke test the MSI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # PowerShell 7.3+'s $PSNativeCommandUseErrorActionPreference (on by default) treats ANY
          # stderr line from a native process as a terminating error regardless of exit code — the
          # JVM's routine --enable-native-access warnings go to stderr, so this fired every time
          # even though Kalita.exe actually exited 0 (confirmed: "--self-test OK" prints before the
          # job still gets marked failed). Disabling it restores plain exit-code-based handling.
          $PSNativeCommandUseErrorActionPreference = $false
          $msi = Get-ChildItem -Path modules/app-desktop/build/jpackage-msi -Filter *.msi | Select-Object -First 1
          Start-Process msiexec.exe -ArgumentList "/i `"$($msi.FullName)`" /quiet /qn /norestart" -Wait
          $exe = "C:\Program Files\Kalita\Kalita.exe"
          if (-not (Test-Path $exe)) { throw "MSI installed but $exe is missing" }
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Kalita.exe --self-test exited $LASTEXITCODE" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kalita-${{ matrix.os }}
          path: |
            modules/app-desktop/build/appimage/*.AppImage
            modules/app-desktop/build/jpackage-msi/*.msi
          if-no-files-found: ignore
          retention-days: 7

  android:
    # Stage 0.4 PoC (dev_plan.md): Jackcess's write-stress scenario (§8.2) replayed on a real
    # Android emulator — the actual uncertainty this stage removes is whether Jackcess's file I/O,
    # MEMO/LVAL handling, and index maintenance all work unmodified under Android's ART runtime
    # and sandboxed filesystem, not the write logic itself (already covered by storage-mdb's JVM
    # test). `-Pfdroid` throughout proves the whole Android build path never touches app-desktop
    # or QtJambi (settings.gradle.kts excludes it from the project graph under that flag).
    name: android (API ${{ matrix.api-level }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      # Standard GitHub-hosted Ubuntu runners support hardware-accelerated emulation once KVM is
      # enabled this way — confirmed against this action's own CI, which uses plain ubuntu-24.04/
      # ubuntu-latest, not larger runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew -Pfdroid :modules:app-android:connectedDebugAndroidTest

      - name: Upload androidTest report (debug)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-test-report-api${{ matrix.api-level }}
          path: modules/app-android/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Pull the scenario 8.2 output off the emulator
        # app-android is a library module — only its self-instrumenting androidTest APK gets
        # installed, under AGP's default testApplicationId ("<namespace>.test"), not the library's
        # own namespace. Discovering it via `pm list packages` avoids hardcoding that convention.
        run: |
          mkdir -p scenario82-output
          pkg=$(adb shell pm list packages | tr -d '\r' | grep kalita | sed 's/package://' | head -1)
          echo "instrumented test package: $pkg"
          adb pull "/sdcard/Android/data/$pkg/files/scenario82.mdb" scenario82-output/
          adb pull "/sdcard/Android/data/$pkg/files/scenario82.expected.txt" scenario82-output/

      - name: Upload scenario 8.2 output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-scenario82-api${{ matrix.api-level }}
          path: scenario82-output/
          retention-days: 7

  oracle-jet:
    # Cross-checks the Android-written file with the real Microsoft Jet engine (dev_plan.md §15
    # stage 0, 0.4; §8.2) — the other half of 0.4's acceptance criterion, run after `android` so
    # it has a real file to check instead of a synthetic one built on Windows itself.
    name: oracle-jet (API ${{ matrix.api-level }})
    needs: android
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download scenario 8.2 output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-scenario82-api${{ matrix.api-level }}
          path: scenario82-output

      - name: "Install Access Database Engine (ACE: DAO.DBEngine.120, Jet-format-compatible)"
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          Invoke-WebRequest -Uri "https://download.microsoft.com/download/3/5/C/35C84C36-661A-44E6-9324-8786B8DBE231/AccessDatabaseEngine.exe" -OutFile "$env:RUNNER_TEMP\AccessDatabaseEngine.exe"
          Start-Process "$env:RUNNER_TEMP\AccessDatabaseEngine.exe" -ArgumentList "/quiet" -Wait

      - name: Verify with the real Jet engine (32-bit cscript, matching the x86 ACE install)
        shell: cmd
        run: >
          %SystemRoot%\SysWOW64\cscript.exe //nologo
          tools\mdb-research\jet-oracle\verify-scenario82.vbs
          scenario82-output\scenario82.mdb
          scenario82-output\scenario82.expected.txt
