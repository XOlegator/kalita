name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check-release-worthy:
    # release-please's default versioning strategy bumps the patch version for
    # ANY included commit type once there's no feat/fix/breaking change to
    # bump minor/major instead (versioning-strategies/default.js falls through
    # to PatchVersionUpdate) — chore/docs/ci/build-only pushes would otherwise
    # still cut a release. AGENTS.md says they shouldn't, so gate the whole
    # job on there being an actual feat/fix/perf/revert/breaking commit since
    # the last tag; release-please still batches and changelogs the skipped
    # chore/docs commits once a real one lands.
    runs-on: ubuntu-latest
    outputs:
      release_worthy: ${{ steps.check.outputs.release_worthy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for a feat/fix/breaking commit since the last tag
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "release_worthy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_tag=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [[ -z "$last_tag" ]]; then
            echo "release_worthy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git log "$last_tag"..HEAD --pretty=%B \
              | grep -qE '^(feat|fix|perf|revert)(\([^)]*\))?!?:|^[a-zA-Z]+(\([^)]*\))?!:|^BREAKING CHANGE:'; then
            echo "release_worthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_worthy=false" >> "$GITHUB_OUTPUT"
          fi

  release-please:
    needs: check-release-worthy
    if: needs.check-release-worthy.outputs.release_worthy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
