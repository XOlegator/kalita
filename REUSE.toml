version = 1
SPDX-PackageName = "kalita"
SPDX-PackageSupplier = "Oleg Ekhlakov <o.ekhlakov@protonmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/XOlegator/kalita"

# Our own files that can't carry an inline header: binary, or JSON (no comment
# syntax), or regenerated by release-please (a header would fight its own
# insertion point).
[[annotations]]
path = [
  "tools/mdb-research/qj.png",
  "release-please-config.json",
  ".release-please-manifest.json",
  "CHANGELOG.md",
  # MCPB's own manifest.json schema has no room for a comment field; "version" is also
  # sed-substituted by release.yml's "Assemble kalita.mcpb" step each build.
  "modules/app-cli/packaging/mcpb/manifest.json",
  # Claude Code plugin/marketplace manifests (dev_plan.md §12.16) — same "JSON has no
  # comment syntax" reason as manifest.json above.
  ".claude-plugin/marketplace.json",
  "agent/skills/kalita-bookkeeping/.claude-plugin/plugin.json",
  "agent/skills/kalita-bookkeeping/.mcp.json",
  "gradle/verification-metadata.xml",
  "renovate.json",
  # Synthetic bank-statement fixtures (binary .xls generated by LibreOffice from made-up data).
  "plugins/import-apibank/src/test/resources/statement-text.xls",
  "plugins/import-apibank/src/test/resources/statement-typed.xls",
  "modules/app-desktop/src/test/resources/statement-text.xls",
  "modules/app-desktop/packaging/linux/kalita.png",
  # debian/control, .../changelog and .../copyright don't reliably support "#"
  # comments in their own formats (control: none per policy; changelog/
  # copyright: dpkg/debhelper tooling parses them strictly); source/format is
  # a one-line plain-text file. changelog and control are also rewritten by
  # the PPA workflow's own `dch`/version-substitution steps each build.
  "modules/app-desktop/packaging/debian/control",
  "modules/app-desktop/packaging/debian/changelog",
  "modules/app-desktop/packaging/debian/copyright",
  "modules/app-desktop/packaging/debian/source/format",
]
SPDX-FileCopyrightText = "2026 Oleg Ekhlakov <o.ekhlakov@protonmail.com>"
SPDX-License-Identifier = "GPL-3.0-only"

# Gradle wrapper: vendored from Gradle, not our copyright. gradlew/gradlew.bat
# already carry their own inline SPDX header (Gradle, Inc.'s own); the jar and
# properties file can't, and both are regenerated by `gradle wrapper`, so an
# inline header here would just be lost on the next upgrade anyway.
[[annotations]]
path = [
  "gradle/wrapper/gradle-wrapper.jar",
  "gradle/wrapper/gradle-wrapper.properties",
]
SPDX-FileCopyrightText = "Gradle, Inc. and contributors"
SPDX-License-Identifier = "Apache-2.0"
