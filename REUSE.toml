version = 1
SPDX-PackageName = "kalita"
SPDX-PackageSupplier = "Oleg Ekhlakov <o.ekhlakov@protonmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/XOlegator/kalita"

# Our own files that can't carry an inline header: binary, or JSON (no comment
# syntax), or regenerated by release-please (a header would fight its own
# insertion point).
[[annotations]]
path = [
  "tools/mdb-research/qj.png",
  "release-please-config.json",
  ".release-please-manifest.json",
  "CHANGELOG.md",
  "gradle/verification-metadata.xml",
  "renovate.json",
]
SPDX-FileCopyrightText = "2026 Oleg Ekhlakov <o.ekhlakov@protonmail.com>"
SPDX-License-Identifier = "GPL-3.0-only"

# Gradle wrapper: vendored from Gradle, not our copyright. gradlew/gradlew.bat
# already carry their own inline SPDX header (Gradle, Inc.'s own); the jar and
# properties file can't, and both are regenerated by `gradle wrapper`, so an
# inline header here would just be lost on the next upgrade anyway.
[[annotations]]
path = [
  "gradle/wrapper/gradle-wrapper.jar",
  "gradle/wrapper/gradle-wrapper.properties",
]
SPDX-FileCopyrightText = "Gradle, Inc. and contributors"
SPDX-License-Identifier = "Apache-2.0"
