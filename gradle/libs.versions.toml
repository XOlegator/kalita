[versions]
# JDK 25 LTS toolchain (see dev_plan.md §9.1); Kotlin targets an Android-compatible API level.
jdk = "25"
kotlin = "2.4.21"
android-gradle-plugin = "9.4.1"
android-compileSdk = "36"
android-minSdk = "26"
junit-bom = "6.1.3"
kotest = "6.2.5"
jqwik = "1.10.2"
kotlinx-serialization = "1.11.0"
okhttp = "5.5.0"
clikt = "5.1.0"
jackcess = "5.1.7"
androidx-test = "1.7.0"
androidx-test-ext-junit = "1.3.0"
# Must match the system Qt minor version exactly (QtJambi links against the real libQt6*.so at
# runtime, it does not bundle Qt on desktop). Ubuntu/Kubuntu 26.04 "resolute" ships Qt 6.10.2
# (qt6-base-dev candidate, confirmed via apt-cache policy) — not the newer 6.12 QtJambi itself
# supports, so this stays pinned to 6.10.2 until the distro's Qt moves.
qtjambi = "6.10.2"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit-bom" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
jackcess = { module = "io.github.spannm:jackcess", version.ref = "jackcess" }
qtjambi = { module = "io.qtjambi:qtjambi", version.ref = "qtjambi" }
qtjambi-native-linux-x64 = { module = "io.qtjambi:qtjambi-native-linux-x64", version.ref = "qtjambi" }
qtjambi-native-windows-x64 = { module = "io.qtjambi:qtjambi-native-windows-x64", version.ref = "qtjambi" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "android-gradle-plugin" }
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
