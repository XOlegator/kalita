[versions]
# JDK 25 LTS toolchain (see dev_plan.md §9.1); Kotlin targets an Android-compatible API level.
jdk = "25"
kotlin = "2.4.21"
android-gradle-plugin = "9.4.1"
android-compileSdk = "36"
android-minSdk = "26"
junit-bom = "6.1.3"
kotest = "6.2.6"
jqwik = "1.10.2"
kotlinx-serialization = "1.12.0"
okhttp = "5.5.0"
clikt = "5.1.0"
jackcess = "5.2.0"
# Upstream insurance line (dev_plan.md §8.3): built and tested with -Pkalita.jackcess=upstream.
jackcess-upstream = "5.0.4"
androidx-test = "1.7.0"
androidx-test-ext-junit = "1.3.0"
# Must match the system Qt minor version exactly (QtJambi links against the real libQt6*.so at
# runtime, it does not bundle Qt on desktop). Ubuntu/Kubuntu 26.04 "resolute" ships Qt 6.10.2
# (qt6-base-dev candidate, confirmed via apt-cache policy) — not the newer 6.12 QtJambi itself
# supports, so this stays pinned to 6.10.2 until the distro's Qt moves.
qtjambi = "6.10.2"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit-bom" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
jackcess = { module = "io.github.spannm:jackcess", version.ref = "jackcess" }
jackcess-upstream = { module = "com.healthmarketscience.jackcess:jackcess", version.ref = "jackcess-upstream" }
qtjambi = { module = "io.qtjambi:qtjambi", version.ref = "qtjambi" }
qtjambi-native-linux-x64 = { module = "io.qtjambi:qtjambi-native-linux-x64", version.ref = "qtjambi" }
qtjambi-native-windows-x64 = { module = "io.qtjambi:qtjambi-native-windows-x64", version.ref = "qtjambi" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }

# Security floors for build tooling only (AGP's own classpath in build-logic and Android Lint's
# `androidLintTool`), applied as dependency constraints, never as dependencies: AGP 9.4.1 / Lint
# 32.4.1 pull vulnerable versions transitively. Nothing here ships in an app. Drop an entry once
# AGP itself requires the patched version (`./gradlew -p build-logic dependencies` shows it).
build-floor-bcprov = "org.bouncycastle:bcprov-jdk18on:1.86"       # GHSA-9pwp-9qqc-pr26, GHSA-qp49-qgx5-5m26, GHSA-c3fc-8qff-9hwx
build-floor-bcpkix = "org.bouncycastle:bcpkix-jdk18on:1.86"       # GHSA-wg6q-6289-32hp
build-floor-bcutil = "org.bouncycastle:bcutil-jdk18on:1.86"       # must match bcprov/bcpkix
build-floor-jose4j = "org.bitbucket.b_c:jose4j:0.9.7"             # GHSA-3677-xxcr-wjqv
build-floor-jdom2 = "org.jdom:jdom2:2.0.6.1"                      # GHSA-2363-cqg2-863c
build-floor-commons-lang3 = "org.apache.commons:commons-lang3:3.21.0" # GHSA-j288-q9x7-2f5v
build-floor-httpclient = "org.apache.httpcomponents:httpclient:4.5.14" # GHSA-7r82-7xv7-xcpj

[bundles]
build-tool-security-floors = [
    "build-floor-bcprov", "build-floor-bcpkix", "build-floor-bcutil", "build-floor-jose4j",
    "build-floor-jdom2", "build-floor-commons-lang3", "build-floor-httpclient",
]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "android-gradle-plugin" }
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
